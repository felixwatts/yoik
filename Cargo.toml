[package]
name = "yoik"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json"] }
